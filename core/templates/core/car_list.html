<!DOCTYPE html>
<html lang="uk">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Наш Автопарк</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Автопарк компанії</h1>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Марка</th>
                    <th>Модель</th>
                    <th>Номерний знак</th>
                </tr>
            </thead>
            <tbody>
                {% for car in cars %}
                <tr>
                    <td>{{ car.brand }}</td>
                    <td>{{ car.model }}</td>
                    <td>{{ car.license_plate }}</td>
                </tr>
                {% empty %}
                <tr><td colspan="3">Машин поки немає.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
