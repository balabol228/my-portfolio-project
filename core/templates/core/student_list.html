<!DOCTYPE html>
<html lang="uk">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Наші Студенти</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Список студентів</h1>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Ім'я</th>
                    <th>Прізвище</th>
                    <th>Група</th>
                    <th>Телефон</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student.first_name }}</td>
                    <td>{{ student.last_name }}</td>
                    <td>{{ student.group_name }}</td>
                    <td>{{ student.phone }}</td>
                </tr>
                {% empty %}
                <tr><td colspan="4">Студентів поки немає.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
