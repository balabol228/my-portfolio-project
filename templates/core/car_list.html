{% extends 'base.html' %}
{% block title %}Автопарк{% endblock %}
{% block content %}
<div class="bg-white p-4 rounded shadow-sm">
    <h1 class="mb-4">Автопарк компанії</h1>
    <table class="table table-hover">
        <thead class="table-dark">
            <tr>
                <th>Марка</th>
                <th>Модель</th>
                <th>Номерний знак</th>
            </tr>
        </thead>
        <tbody>
            {% for car in cars %}
            <tr>
                <td>{{ car.brand }}</td>
                <td>{{ car.model }}</td>
                <td><span class="badge bg-secondary fs-6">{{ car.license_plate }}</span></td>
            </tr>
            {% empty %}
            <tr><td colspan="3">Машин поки немає.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
